name = "cpsat-scheduler"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["CpsatScheduler"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[leanOptions.weak.linter]
mathlibStandardSet = true
style.native = false
style.header = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "CpsatScheduler"

[[lean_lib]]
name = "CpsatSolver"

[[lean_exe]]
name = "cpsat_demo"
root = "cpsat_demo"
